<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrinzhLibrary</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        * { margin: 0; padding: 0; outline: none; transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; }

        button, a { cursor: pointer; }

        [data-theme="light"] {
            --white: #ffffff;
            --black: #000000;
            --bcg: #F9FAFB;
            --border: #E5E7EB;
            --el: #eff1f5;
            --accent: #FF4C39;
            --accent-hover: #E64433;
            --imgLDN: url('LDN_GLASS.png');
            --unnactive: #505050;
            --unnactive1: #86868b;
        }

        [data-theme="dark"] {
            --white: #1a1a1a;
            --black: #ffffff;
            --bcg: #0f0f0f;
            --border: #2a2a2a;
            --el: #1f1f1f;
            --accent: #FF5544;
            --accent-hover: #FF6B5A;
            --imgLDN: url('LDN_GLASS_BLACK.png');
            --unnactive: #b0b0b0;
            --unnactive1: #888888;
        }

        * {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        *::-webkit-scrollbar {
            display: none;
        }

        body { background: var(--bcg); padding-top: 100px; color: var(--black); }

        input { color: var(--black); }

        header {
            width: 100%;
            height: 65px;
            position: fixed;
            top: 0%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            padding-left: 20px; padding-right: 20px;
            background: var(--white);
            border-bottom: 1px solid var(--border);
            z-index: 9999;

            & .logo {
                height: 35px;
            }

            & .search {
                position: relative;
                display: flex;
                align-items: center;

                & img {
                    position: absolute;
                    left: 12px;
                    height: 20px;
                    opacity: 0.35;
                    pointer-events: none;
                }

                & input {
                    height: 35px;
                    width: 500px;
                    border-radius: 10px;
                    background: var(--bcg);
                    border: 1px solid var(--border);
                    box-sizing: border-box;

                    padding-left: 40px;
                    padding-right: 10px;

                    transition: all 0.5s;

                    &:focus {
                        border: 1px solid var(--black);
                        background: var(--white);
                    }
                }
            }


            & button {
                height: 35px;
                box-sizing: border-box;
                padding-left: 15px; padding-right: 15px;
                border-radius: 10px;
                border: 0;
                background: var(--accent);
                color: var(--white);
                display: flex;
                align-items: center; justify-content: center;
                gap: 10px;

                & img { filter: invert(1); height: 20px; }

                &:hover { background: var(--accent-hover); }
            }
        }

        .books {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 25px;
            padding: 30px 30px 0 30px;
        }

        .books .book {
            display: flex;
            flex-direction: column;
            gap: 0;
            transition: transform 0.3s, box-shadow 0.3s;
            border-radius: 20px;
            cursor: pointer;

            &:hover {
                transform: translateY(-5px);
            }

            & img { width: 100%; border-radius: 20px 20px 20px 0; }
            & .book__about {
                width: 100%;
                box-sizing: border-box;
                padding: 15px;
                background: var(--white);
                border-radius: 0 20px 20px 20px;
                display: flex;
                flex-direction: column;
                gap: 5px;

                & .autor { font-size: 12.5px; color: var(--unnactive); }
            }
        }

        .block {
            z-index: 999999;
            position: fixed;
            left: 50%; top: 50%;
            transform: translatex(-50%) translateY(-50%);
            background: var(--white);
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
            padding: 30px 20px 30px 20px;
            border-radius: 20px;
            width: 400px;
            height: auto;
            display: flex;
            flex-direction: column;
            align-items: start;
            gap: 20px;
            transition: opacity 0.2s ease-in-out;
            border: 1px solid var(--border);

            & .point {
                display: flex;
                flex-direction: column;
                align-items: start;
                gap: 7px;
                width: 100%;
            }
        }

        .publish__book {
            height: 400px;
            overflow-y: auto;
            opacity: 0; display: none;
            transition: opacity 0.5px;

            & .point {

                & input {
                    height: 35px;
                    width: 100%;
                    border-radius: 10px;
                    background: var(--bcg);
                    border: 1px solid var(--border);
                    box-sizing: border-box;
                    padding-right: 15x; padding-left: 15px;
                    transition: all 0.5s;

                    &:focus { border: 1px solid var(--black); background: var(--white); }
                }

                & textarea {
                    min-height: 100px;
                    max-width: 100%; min-width: 100%;
                    border-radius: 10px;
                    background: var(--bcg);
                    border: 1px solid var(--border);
                    box-sizing: border-box;
                    padding: 15px;
                    transition: background 0.5s; transition: border 0.5s;
                    white-space: pre-wrap;

                    &:focus { border: 1px solid var(--black); background: var(--white); }
                }

                & label {
                    height: 55px;
                    padding: 0 20px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    text-align: center;
                    background-color: var(--accent);
                    color: var(--black);
                    background: var(--bcg);
                    border: 1px dashed var(--accent);
                    border-radius: 10px;
                    cursor: pointer;
                    z-index: 999;
                    font-size: 14px;
                }

                & button {
                    width: 100%;
                    border-radius: 10px;
                    background: var(--accent);
                    box-sizing: border-box;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    height: 40px;
                    border: 0;
                    color: var(--white);
                    
                    &:hover { background: var(--accent-hover); }
                }
            }
        }

        .password__book {
            opacity: 0; display: none;
            transition: opacity 0.5px;

            & .point {
                & input {
                    height: 35px;
                    width: 100%;
                    border-radius: 10px;
                    background: var(--bcg);
                    border: 1px solid var(--border);
                    box-sizing: border-box;
                    padding-right: 15x; padding-left: 15px;
                    transition: all 0.5s;

                    &:focus { border: 1px solid var(--black); background: var(--white); }
                }

                & button {
                    width: 100%;
                    border-radius: 10px;
                    background: var(--accent);
                    box-sizing: border-box;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    height: 40px;
                    border: 0;
                    color: var(--white);
                    
                    &:hover { background: var(--accent-hover); }
                }
            }
        }

        .close__book {
            height: 35px;
            width: 35px;
            box-sizing: border-box;
            padding: 0;
            border-radius: 10px;
            border: 0;
            background: var(--bcg);
            display: flex;
            align-items: center; justify-content: center;

            &:hover { background: var(--el); }

            & img { filter: invert(0); height: 20px; }
        }

        .book__bcg {
            top: 0;
            position: fixed;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            z-index: 9999999;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .book__block {
            position: fixed;
            background: var(--white);
            box-shadow: 0 0 #00000061 10px;
            border: 1px solid var(--border);
            box-sizing: border-box;
            padding: 30px;
            border-radius: 20px;
            width: 750px;
            height: 80%;
            overflow-y: auto;
            display: flex;
            align-items: flex-start;
            gap: 20px;
            transition: opacity 0.2s ease-in-out;

            .main__of__book {
                display: flex;
                flex-direction: column;
                gap: 20px;
                width: 100%;
                min-width: 0;
            }

            img {
                width: 200px;
                border-radius: 10px;
            }

            .name__of__book {
                font-size: 30px;
                font-weight: 550;
            }

            .characters {
                width: 100%;
                min-width: 0;
                box-sizing: border-box;
                border-radius: 10px;
                padding: 15px;
                background: var(--el);
                display: flex;
                flex-direction: column;
                gap: 10px;

                p {
                    width: 100%;
                    min-width: 0;
                    overflow: hidden;
                    text-overflow: ellipsis;
                    white-space: nowrap;
                    margin: 0;
                    transition: height 0.5s;
                }

                .buttons {
                    display: flex;
                    gap: 5px;

                    button {
                        width: 40px;
                        height: 40px;
                        background: var(--white);
                        border: 0;
                        border-radius: 50%;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        cursor: pointer;

                        img {
                            width: 15px;
                        }

                        &:hover {
                            filter: brightness(90%);
                        }
                    }
                }
            }

            & .book__text {
                display: flex;
                flex-direction: column;
                gap: 10px;

                & .booktext {
                    white-space: pre-wrap;
                }
            }

            & .close__book {
                width: 40px;
                height: 40px;
                background: var(--white);
                border: 0;
                border-radius: 50%;
                display: flex;
                justify-content: center;
                align-items: center;
                cursor: pointer;

                img {
                    width: 15px;
                }

                &:hover {
                    filter: brightness(90%);
                }
            }
        }

        .footer__block {
            margin-top: 80px;
            width: 100%;
            background: var(--white);
            border-top: 1px solid var(--border);
            padding: 50px 30px 30px 30px;
            box-sizing: border-box;
        }

        footer {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 35px;

            & .flex__footer {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 40px;
                padding-bottom: 35px;
                border-bottom: 1px solid var(--border);

                & .left {
                    display: flex;
                    align-items: center;
                    gap: 30px;
                    flex: 1;

                    & .point {
                        display: flex;
                        align-items: center;
                        gap: 10px;

                        & p {
                            color: var(--unnactive1);
                            font-size: 14px;
                            font-weight: 400;
                        }

                        & button {
                            width: 36px;
                            height: 36px;
                            border-radius: 8px;
                            border: none;
                            background: var(--bcg);
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            transition: all 0.2s ease;

                            & i {
                                color: var(--black);
                                font-size: 18px;
                            }

                            &:hover {
                                background: var(--accent);
                                
                                & i {
                                    color: var(--white);
                                }
                            }
                        }
                    }
                }

                & .right {
                    display: flex;
                    align-items: center;
                    gap: 15px;

                    & img {
                        width: 48px;
                        border-radius: 12px;
                        transition: all 0.2s ease;
                    }

                    & p {
                        color: var(--unnactive1);
                        font-size: 14px;
                        font-weight: 400;
                    }
                }
            }

            & > p {
                text-align: center;
                color: var(--unnactive1);
                font-size: 13px;
                font-weight: 400;
                line-height: 1.6;
            }
        }

        .close__book {
            width: 40px;
            height: 40px;
            background: var(--white);
            border: 0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;

            img {
                width: 15px;
            }

            &:hover {
                filter: brightness(90%);
            }
        }

        @media (max-width: 1024px) {
            .books {
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
                padding: 20px;
            }

            .book__bcg .book__block {
                min-width: 90%;
                padding: 20px;
            }
        }

        @media (max-width: 994px) {
            body {
                padding-top: 120px;
            }

            header {
                height: auto;
                flex-wrap: wrap;
                padding: 10px 15px;
                gap: 10px;

                & .logo {
                    height: 30px;
                }

                & .search {
                    order: 3;
                    width: 100%;
                    margin-top: 10px;

                    & input {
                        width: 100%;
                    }
                    
                }

                & button {
                    font-size: 14px;
                    padding-left: 12px;
                    padding-right: 12px;
                    height: 32px;

                    & img {
                        height: 16px;
                    }
                }
            }

            .books {
                grid-template-columns: repeat(3, 1fr);
                gap: 15px;
                padding: 15px;
            }

            .block {
                width: 90%;
                max-width: 400px;
            }

            .book__bcg .book__block {
                min-width: 90%;
                max-height: 90vh;
                overflow-y: auto;
                padding: 20px 15px;

                & img {
                    height: auto;
                }
            }

            .footer__block {
                padding: 35px 20px 20px 20px;
                margin-top: 50px;

                & footer .flex__footer {
                    flex-direction: column;
                    align-items: flex-start;
                    gap: 25px;

                    & .left {
                        flex-direction: column;
                        align-items: flex-start;
                        gap: 15px;
                        width: 100%;
                    }

                    & .right {
                        width: 100%;
                    }
                }
            }
        }

        @media (max-width: 480px) {
            body {
                padding-top: 120px;
            }

            header {

                & .logo {
                    height: 28px;
                }

                & button {
                    min-width: 35px;
                }
            }

            .books {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
                padding: 15px;
            }

            .books .book {
                max-width: 100%;

                & .book__about {
                    padding: 12px;

                    & p {
                        font-size: 16px;
                    }

                    & .autor {
                        font-size: 13px;
                    }
                }
            }

            .block {
                width: 95%;
                padding: 20px 12px;
                border-radius: 15px;
            }

            .publish__book {
                max-height: 70vh;
            }

            .book__bcg .book__block {
                width: 95%;
                min-width: unset;
                padding: 15px;

                & .main__of__book {
                    & .name__of__book {
                        font-size: 18px;
                    }

                    & .characters {
                        flex-direction: column;
                        height: auto;

                        & p {
                            white-space: normal;
                            height: auto;
                        }
                    }

                    & .book__text {
                        padding: 15px;

                        & .name__of__book {
                            font-size: 16px;
                        }
                    }
                }
            }

            .footer__block {
                padding: 30px 15px 15px 15px;
                margin-top: 40px;

                & footer {
                    gap: 25px;

                    & .flex__footer {
                        & .left {
                            gap: 12px;

                            & .point {
                                & p {
                                    font-size: 13px;
                                }

                                & button {
                                    width: 34px;
                                    height: 34px;

                                    & i {
                                        font-size: 16px;
                                    }
                                }
                            }
                        }

                        & .right {
                            & img {
                                width: 35px;
                            }

                            & p {
                                font-size: 12px;
                            }
                        }
                    }

                    & > p {
                        font-size: 11px;
                        line-height: 1.5;
                    }
                }
            }
        }

        @media (max-width: 434px) {
            header {

                & .logo {
                    height: 28px;
                }

                & button {
                    min-width: 35px;
                    font-size: 0;
                    gap: 0;
                }

                & i {
                    font-size: 10px;
                }
            }

            .books {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 15px;
            }
        }

        @media (max-width: 360px) {
            .block {
                width: 95%;
            }
        }

        @media (max-width: 759px) {
            .book__bcg .book__block {
                width: 95%;
                min-width: unset;
                padding: 15px;

                & .main__of__book {
                    & .name__of__book {
                        font-size: 18px;
                    }

                    & .characters {
                        flex-direction: column;
                        height: auto;

                        & p {
                            white-space: normal;
                            height: auto;
                        }
                    }

                    & .book__text {
                        padding: 15px;

                        & .name__of__book {
                            font-size: 16px;
                        }
                    }
                }
            }
        }

        @media (max-width: 554px) {
            .book__bcg .book__block {
                width: 95%;
                height: 100%;
                min-width: unset;
                padding: 15px;

                & .bookimg {
                    display: none;
                }

                & .main__of__book {
                    & .name__of__book {
                        font-size: 18px;
                    }

                    & .characters {
                        flex-direction: column;
                        height: auto;

                        & p {
                            white-space: normal;
                            height: auto;
                        }
                    }

                    & .book__text {
                        padding: 15px;

                        & .name__of__book {
                            font-size: 16px;
                        }
                    }
                }
            }
        }

    </style>
</head>
<body data-theme="light">
    <header>
        <img id="logo" class="logo" src="ladlibrary.png" alt="ladlibrary">
        <div class="search">
            <img id="1inv" src="seacrh.svg" alt="поиск">
            <input id="searchInput" type="text" placeholder="Поиск книг..." oninput="searchBooks()">
        </div>
        <div style="display: flex; gap: 10px;">
            <button onclick="Open_public_block()"><img id="2inv" src="new book.svg" alt="новая книга">Опубликовать книгу</button>
            <button onclick="if (document.body.dataset.theme === 'light') { document.body.setAttribute('data-theme', 'dark'); } else { document.body.setAttribute('data-theme', 'light'); }; updateImage()" style="background: var(--el); color: var(--unnactive1); border: 1px solid var(--border);" id="theme-button"><i class="fas fa-moon"></i></button>
        </div>
    </header>

    <div style="width: 100%;" id="bookload" class="load"></div>
    <div class="books" id="booksContainer">
        
        <!--<div onclick="Openbook({id_of_book})" class="book">
            <img src="https://placehold.co/300x450" alt="Книга">
            <div class="book__about">
                <p>Название книги</p>
                <p class="autor">Автор</p>
            </div>
        </div>-->

    </div>

    <div id="public_book" class="block publish__book">
        <div style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
            <div class="point" style="width: auto;">
                <p style="font-size: 25px; font-weight: 600;">Публикация</p>
            </div>
            <button onclick="document.getElementById('public_book').style.display = 'none'" class="close__book"><img id="3inv" src="close.svg" alt="X"></button>
        </div>
        <div class="point">
            <p>Название книги</p>
            <input id="bookTitle" type="text" placeholder="Название" required>
        </div>
        <div class="point">
            <p>Автор</p>
            <input id="bookAuthor" type="text" placeholder="Автор" required>
        </div>
        <div class="point">
            <p>Персонажи</p>
            <input id="bookCharacters" type="text" placeholder="Персонажи" required>
        </div>
        <div class="point">
            <p>Текст книги</p>
            <textarea id="bookText" placeholder="Персонаж_А сделал Действие_Б" required></textarea>
        </div>
        <div class="point">
            <label for="imageInput" class="upload__photo">
                Выберите изображение (до 100кб и соотношением ~4:6)
            </label>
            <input type="file" accept=".jpg,.jpeg,.png,.gif" id="imageInput" style="display:none;" onchange="handleImageUpload(event)" required>
        </div>
        <div class="point">
            <button onclick="publishBook()">Опубликовать</button>
        </div>
    </div>

    <div id="password_block" class="block password__book">
        <div style="width: 100%; display: flex; justify-content: space-between; align-items: start;">
            <div class="point" style="width: auto;">
                <p style="font-size: 25px; font-weight: 600;">Э, бля, не спеши так!</p>
                <p>пиши пароль</p>
            </div>
            <button onclick="document.getElementById('password_block').style.display = 'none'" class="close__book"><img id="4inv" src="close.svg" alt="X"></button>
        </div>
        <div class="point">
            <input id="password" type="text" placeholder="пароль..." required>
        </div>
        <div class="point">
            <button onclick="checkpass(document.getElementById('password').value)">Проверить</button>
        </div>
    </div>

    <div id="book" class="book__bcg">
        <div class="book__block">
            <img class="bookimg" id="currentBookImg" src="https://placehold.co/300x450" alt="обложка книги">
            <div class="main__of__book">
                <div style="width: 100%; display: flex; align-items: center; justify-content: space-between;"><p class="name__of__book" id="currentBookTitle">Загрузка...</p><button onclick="document.getElementById('book').style.display = 'none'" class="close__book"><img id="5inv" src="close.svg" alt="X"></button></div>
                <div class="characters">
                    <p id="characters">Персонажи: <span style="color: var(--unnactive);">Загрузка...</span></p>
                    <div class="buttons">
                        <button onclick="document.getElementById('characters').style.height = '25px'; document.getElementById('characters').style.whiteSpace = 'nowrap';"><img id="6inv" src="arrow_top.svg" alt="стрелка"></button>
                        <button onclick="document.getElementById('characters').style.height = 'auto'; document.getElementById('characters').style.whiteSpace = 'wrap';"><img id="7inv" src="arrow_bottom.svg" alt="стрелка"></button>
                    </div>
                </div>
                <div class="book__text">
                    <p class="name__of__book">Книга</p>
                    <div class="booktext" id="currentBookText">
                        <p style="color: var(--unnactive);">Загрузка...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer__block">
        <footer>
            <div class="flex__footer">
                <div class="left">
                    <div class="point">
                        <p>Телеграм-канал</p>
                        <button onclick="openTg('Krinzhatina_industry')"><i class="fab fa-telegram"></i></button>
                    </div>
                    <div class="point">
                        <p>Канао</p>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script>

        const firebaseConfig = {
            apiKey: atob("QUl6YVN5QkFHV3dLaGIzSzdpWXItZmlXY0txS2QyeWRYQ3hMSG1B"),
            authDomain: atob("bGFkbGlicmFyeS00MWNmOS5maXJlYmFzZWFwcC5jb20="),
            databaseURL: atob("aHR0cHM6Ly9sYWRsaWJyYXJ5LTQxY2Y5LWRlZmF1bHQtcnRkYi5hc2lhLXNvdXRoZWFzdDEuZmlyZWJhc2VkYXRhYmFzZS5hcHA="),
            projectId: atob("bGFkbGlicmFyeS00MWNmOQ=="),
            storageBucket: atob("bGFkbGlicmFyeS00MWNmOS5maXJlYmFzZXN0b3JhZ2UuYXBw"),
            messagingSenderId: atob("NDA0ODUwOTE2OTIz"),
            appId: atob("MTo0MDQ4NTA5MTY5MjM6d2ViOjk5OTM2OWM5YjM2NjEwMWI0ZGU2MWU="),
            measurementId: atob("Ry1UREtTTTg0TlFU")
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let allBooks = [];
        let currentBookId = null;

        function loadBooks() {
            database.ref('books').on('value', (snapshot) => {
                allBooks = [];
                const booksContainer = document.getElementById('bookload');
                booksContainer.innerHTML = '';

                if (!snapshot.exists()) {
                    booksContainer.innerHTML = '<div style="text-align: center; padding: 50px; color: var(--unnactive); font-size: 18px;">Пока нет опубликованных книг</div>';
                    return;
                }

                snapshot.forEach((childSnapshot) => {
                    const book = childSnapshot.val();
                    book.id = childSnapshot.key;
                    allBooks.push(book);
                });

                displayBooks(allBooks);
            });
        }

        function displayBooks(books) {
            const booksContainer = document.getElementById('booksContainer');
            booksContainer.innerHTML = '';

            if (books.length === 0) {
                booksContainer.innerHTML = '<div style="text-align: center; padding: 50px; color: var(--unnactive); font-size: 18px; box-sizing: border-box; width: 100%">Книги не найдены</div>';
                return;
            }

            books.forEach(book => {
                const bookElement = document.createElement('div');
                bookElement.className = 'book';
                bookElement.onclick = () => openBook(book.id);
                
                bookElement.innerHTML = `
                    <img src="${book.coverImage}" alt="${book.title}">
                    <div class="book__about">
                        <p>${book.title}</p>
                        <p class="autor">${book.author}</p>
                    </div>
                `;
                
                booksContainer.appendChild(bookElement);
            });
        }

        function searchBooks() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            if (searchTerm === '') {
                displayBooks(allBooks);
                return;
            }

            const filteredBooks = allBooks.filter(book => 
                book.title.toLowerCase().includes(searchTerm) ||
                book.author.toLowerCase().includes(searchTerm) ||
                book.characters.toLowerCase().includes(searchTerm)
            );

            displayBooks(filteredBooks);
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            
            if (!file) return;

            if (file.size > 102400) {
                alert('Файл слишком большой! Максимум 100кб');
                event.target.value = '';
                return;
            }

            const reader = new FileReader();
            
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const aspectRatio = this.width / this.height;
                    const targetRatio = 4 / 6;
                    
                    if (aspectRatio < targetRatio * 0.8 || aspectRatio > targetRatio * 1.2) {
                        alert('Неверное соотношение сторон! Нужно примерно 4:6 (например, 400x600)');
                        event.target.value = '';
                        return;
                    }
                };
                img.src = e.target.result;
            };
            
            reader.readAsDataURL(file);
        }

        function publishBook() {
            const title = document.getElementById('bookTitle').value.trim();
            const author = document.getElementById('bookAuthor').value.trim();
            const characters = document.getElementById('bookCharacters').value.trim();
            const text = document.getElementById('bookText').value;
            const imageInput = document.getElementById('imageInput');

            if (!title || !author || !characters || !text || !imageInput.files[0]) {
                alert('Пожалуйста, заполните все поля!');
                return;
            }

            const file = imageInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                const base64Image = e.target.result;

                const newBook = {
                    title: title,
                    author: author,
                    characters: characters,
                    text: text,
                    coverImage: base64Image,
                    timestamp: Date.now()
                };

                database.ref('books').push(newBook)
                    .then(() => {
                        alert('Книга успешно опубликована!');
                        document.getElementById('public_book').style.display = 'none';
                    })
                    .catch((error) => {
                        alert('Ошибка при публикации: ' + error.message);
                    });
            };

            reader.readAsDataURL(file);
        }

        function openBook(bookId) {
            currentBookId = bookId;
            const book = allBooks.find(b => b.id === bookId);
            
            if (!book) return;

            document.getElementById('currentBookImg').src = book.coverImage;
            document.getElementById('currentBookTitle').textContent = book.title;
            document.getElementById('characters').innerHTML = `Персонажи: <span style="color: var(--unnactive);">${book.characters}</span>`;
            document.getElementById('currentBookText').textContent = book.text;

            document.getElementById('book').style.display = 'flex';
            document.getElementById('characters').style.height = '25px';
            document.getElementById('characters').style.whiteSpace = 'nowrap';
        }

        function Open_public_block() {
            const passBlock = document.getElementById("password_block");
            const pubBlock = document.getElementById("public_book");

            document.getElementById("password").value = '';

            pubBlock.style.display = "none";
            pubBlock.style.opacity = "0";

            passBlock.style.display = "flex";
            setTimeout(() => {
                passBlock.style.opacity = "1";
            }, 50);
        }

        function checkpass(password_input) {
            const passBlock = document.getElementById("password_block");
            const pubBlock = document.getElementById("public_book");

            if (password_input != atob("Z2Zja3lyc2xmMg==")) {
                document.getElementById("password").style.borderColor = "red";
                document.getElementById("password").value = '';
                return;
            }

            document.getElementById('bookTitle').value = '';
            document.getElementById('bookAuthor').value = '';
            document.getElementById('bookCharacters').value = '';
            document.getElementById('bookText').value = '';
            document.getElementById('imageInput').value = '';
            
            passBlock.style.opacity = "0";
            setTimeout(() => {
                passBlock.style.display = "none";
            }, 250);
            pubBlock.style.display = "flex";
            setTimeout(() => {
                pubBlock.style.opacity = "1";
            }, 250);
        }

        function openTg(tglink) {
            window.location.href = "https://t.me/" + tglink;
        }

        function updateImage() {
            let theme = document.body.dataset.theme;
            let suffix = (theme === "light") ? "_BLACK" : "";

            const img = document.getElementById('ldn-img');
            if (!img) return;

            img.src = "LDN_GLASS" + suffix + ".png";
            
            const themeButton = document.getElementById('theme-button');
            if (theme === 'dark') {
                themeButton.innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                themeButton.innerHTML = '<i class="fas fa-moon"></i>';
            }

            const logo = document.getElementById("logo");
            if (theme === 'dark') {
                logo.src = 'ladlibrary_dark.png';
                document.getElementById("1inv").style.filter = "invert(1)";
                document.getElementById("2inv").style.filter = "invert(0)";
                document.getElementById("3inv").style.filter = "invert(1)";
                document.getElementById("4inv").style.filter = "invert(1)";
                document.getElementById("5inv").style.filter = "invert(1)";
                document.getElementById("6inv").style.filter = "invert(1)";
                document.getElementById("7inv").style.filter = "invert(1)";
            } else {
                logo.src = 'ladlibrary.png';
                document.getElementById("1inv").style.filter = "invert(0)";
                document.getElementById("2inv").style.filter = "invert(1)";
                document.getElementById("3inv").style.filter = "invert(0)";
                document.getElementById("4inv").style.filter = "invert(0)";
                document.getElementById("5inv").style.filter = "invert(0)";
                document.getElementById("6inv").style.filter = "invert(0)";
                document.getElementById("7inv").style.filter = "invert(0)";
            };
        }

        updateImage();

        loadBooks();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrinzhLibrary</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body data-theme="light">
    <header>
        <img id="logo" class="logo" src="ladlibrary.png" alt="ladlibrary">
        <div class="search">
            <img id="1inv" src="seacrh.svg" alt="поиск">
            <input id="searchInput" type="text" placeholder="Поиск книг..." oninput="searchBooks()">
        </div>
        <div style="display: flex; gap: 10px;">
            <button onclick="Open_public_block()"><img id="2inv" src="new book.svg" alt="новая книга">Опубликовать книгу</button>
            <button onclick="if (document.body.dataset.theme === 'light') { document.body.setAttribute('data-theme', 'dark'); } else { document.body.setAttribute('data-theme', 'light'); }; updateImage()" style="background: var(--el); color: var(--unnactive1); border: 1px solid var(--border);" id="theme-button"><i class="fas fa-moon"></i></button>
        </div>
    </header>

    <div style="width: 100%;" id="bookload" class="load"></div>
    <div class="books" id="booksContainer">
        
        <!--<div onclick="Openbook({id_of_book})" class="book">
            <img src="https://placehold.co/300x450" alt="Книга">
            <div class="book__about">
                <p>Название книги</p>
                <p class="autor">Автор</p>
            </div>
        </div>-->

    </div>

    <div id="public_book" class="block publish__book">
        <div style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
            <div class="point" style="width: auto;">
                <p style="font-size: 25px; font-weight: 600;">Публикация</p>
            </div>
            <button onclick="document.getElementById('public_book').style.display = 'none'" class="close__book"><img id="3inv" src="close.svg" alt="X"></button>
        </div>
        <div class="point">
            <p>Название книги</p>
            <input id="bookTitle" type="text" placeholder="Название" required>
        </div>
        <div class="point">
            <p>Автор</p>
            <input id="bookAuthor" type="text" placeholder="Автор" required>
        </div>
        <div class="point">
            <p>Персонажи</p>
            <input id="bookCharacters" type="text" placeholder="Персонажи" required>
        </div>
        <div class="point">
            <p>Текст книги</p>
            <textarea id="bookText" placeholder="Персонаж_А сделал Действие_Б" required></textarea>
        </div>
        <div class="point">
            <label for="imageInput" class="upload__photo">
                Выберите изображение (до 100кб и соотношением ~4:6)
            </label>
            <input type="file" accept=".jpg,.jpeg,.png,.gif" id="imageInput" style="display:none;" onchange="handleImageUpload(event)" required>
        </div>
        <div class="point">
            <button onclick="publishBook()">Опубликовать</button>
        </div>
    </div>

    <div id="password_block" class="block password__book">
        <div style="width: 100%; display: flex; justify-content: space-between; align-items: start;">
            <div class="point" style="width: auto;">
                <p style="font-size: 25px; font-weight: 600;">Э, бля, не спеши так!</p>
                <p>пиши пароль</p>
            </div>
            <button onclick="document.getElementById('password_block').style.display = 'none'" class="close__book"><img id="4inv" src="close.svg" alt="X"></button>
        </div>
        <div class="point">
            <input id="password" type="text" placeholder="пароль..." required>
        </div>
        <div class="point">
            <button onclick="checkpass(document.getElementById('password').value)">Проверить</button>
        </div>
    </div>

    <div id="book" class="book__bcg">
        <div class="book__block">
            <img class="bookimg" id="currentBookImg" src="https://placehold.co/300x450" alt="обложка книги">
            <div class="main__of__book">
                <div style="width: 100%; display: flex; align-items: center; justify-content: space-between;"><p class="name__of__book" id="currentBookTitle">Загрузка...</p><div style="display: flex; align-items: center; gap: 5px; justify-content: flex-end;" class="bus">
                    <button onclick="Voice_Book()" class="close__book"><img style="border-radius: 0;" id="5inv" src="voice.svg" alt="X"></button>
                    <button onclick="document.getElementById('book').style.display = 'none'; synth.cancel();" class="close__book"><img id="5inv" src="close.svg" alt="X"></button>
                </div></div>
                <div class="characters">
                    <p id="characters">Персонажи: <span style="color: var(--unnactive);">Загрузка...</span></p>
                    <div class="buttons">
                        <button onclick="document.getElementById('characters').style.height = '25px'; document.getElementById('characters').style.whiteSpace = 'nowrap';"><img id="6inv" src="arrow_top.svg" alt="стрелка"></button>
                        <button onclick="document.getElementById('characters').style.height = 'auto'; document.getElementById('characters').style.whiteSpace = 'wrap';"><img id="7inv" src="arrow_bottom.svg" alt="стрелка"></button>
                    </div>
                </div>
                <div class="book__text">
                    <p class="name__of__book">Книга</p>
                    <div class="booktext" id="currentBookText">
                        <p style="color: var(--unnactive);">Загрузка...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer__block">
        <footer>
            <div class="flex__footer">
                <div class="left">
                    <div class="point">
                        <p>Телеграм-канал</p>
                        <button onclick="openTg('Krinzhatina_industry')"><i class="fab fa-telegram"></i></button>
                    </div>
                    <div class="point">
                        <p>Канао</p>
                        <button onclick="openTg('Fromjek')"><i class="fab fa-telegram"></i></button>
                    </div>
                    <div class="point">
                        <p>ЛДН Канал</p>
                        <button onclick="openTg('LDN_Design')"><i class="fab fa-telegram"></i></button>
                    </div>
                    <div class="point">
                        <p>ЛДН Директ</p>
                        <button onclick="openTg('LDN_Design?direct')"><i class="fab fa-telegram"></i></button>
                    </div>
                </div>
                <div class="right">
                    <img id="ldn-img" src="LDN-square.svg" alt="ЛДН">
                    <p>Сайт был сделан LDN</p>
                </div>
            </div>
            <p>Krinzhatina industry, LDN. — KrinzhLibrary™. 2026. Все права защищены.</p>
        </footer>
    </div>

    <script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabaseUrl = atob("aHR0cHM6Ly9kbWJvd3ZscWFveW5memRwanBwZC5zdXBhYmFzZS5jbw==");
const supabaseKey = atob("ZXlKaGJHY2lPaUpJVXpJMU5pSXNJblI1Y0NJNklrcFhWQ0o5LmV5SnBjM01pT2lKemRYQmhZbUZ6WlNJc0luSmxaaUk2SW1SdFltOTNkbXh4WVc5NWJtWjZaSEJxY0hCa0lpd2ljbTlzWlNJNkltRnViMjRpTENKcFlYUWlPakUzTnpBek5qWXlNVFlzSW1WNGNDSTZNakE0TlRrME1qSXhObjAuTnc0QlBJeXRlLVNsa3B5WVFkVU1ZSWNna3NZUk8tVEVlNGN1dUxramxtTQ==");

const supabase = createClient(supabaseUrl, supabaseKey);

let allBooks = [];
let currentBookId = null;

async function loadBooks() {
    allBooks = [];
    const { data, error } = await supabase.from("books").select("*").order("id", { ascending: true });

    const booksContainer = document.getElementById('booksContainer');
    const bookload = document.getElementById('bookload');
    bookload.innerHTML = '';

    if (error) {
        console.error("Ошибка загрузки книг:", error);
        booksContainer.innerHTML = '<div style="text-align:center; padding:50px; color:var(--unnactive); font-size:18px;">Ошибка при загрузке книг. Проверьте настройки Supabase!</div>';
        return;
    }

    if (!data || data.length === 0) {
        booksContainer.innerHTML = '<div style="text-align:center; padding:50px; color:var(--unnactive); font-size:18px;">Пока нет опубликованных книг</div>';
        return;
    }

    data.forEach(book => allBooks.push(book));
    displayBooks(allBooks);
}

function displayBooks(books) {
    const booksContainer = document.getElementById('booksContainer');
    booksContainer.innerHTML = '';

    if (!books || books.length === 0) {
        booksContainer.innerHTML = '<div style="text-align:center; padding:50px; color:var(--unnactive); font-size:18px;">Книги не найдены</div>';
        return;
    }

    books.forEach(book => {
        const bookElement = document.createElement('div');
        bookElement.className = 'book';
        bookElement.onclick = () => openBook(book.id);

        bookElement.innerHTML = `
            <img src="${book.image || 'https://placehold.co/300x450'}" alt="${book.title}">
            <div class="book__about">
                <p>${book.title}</p>
                <p class="autor">${book.autor}</p>
            </div>
        `;

        booksContainer.appendChild(bookElement);
    });
}

window.searchBooks = function() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

    if (!searchTerm) {
        displayBooks(allBooks);
        return;
    }

    const filteredBooks = allBooks.filter(book =>
        (book.title || '').toLowerCase().includes(searchTerm) ||
        (book.autor || '').toLowerCase().includes(searchTerm) ||
        (book.characters || '').toLowerCase().includes(searchTerm)
    );

    displayBooks(filteredBooks);
}

window.handleImageUpload = function(event) {
    const file = event.target.files[0];
    if (!file) return;

    if (file.size > 102400) {
        alert('Файл слишком большой! Максимум 100кб');
        event.target.value = '';
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            const aspectRatio = this.width / this.height;
            const targetRatio = 4 / 6;
            if (aspectRatio < targetRatio * 0.8 || aspectRatio > targetRatio * 1.2) {
                alert('Неверное соотношение сторон! Нужно примерно 4:6 (например, 400x600)');
                event.target.value = '';
                return;
            }
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

window.publishBook = async function() {
    const title = document.getElementById('bookTitle').value.trim();
    const autor = document.getElementById('bookAuthor').value.trim();
    const characters = document.getElementById('bookCharacters').value.trim();
    const text = document.getElementById('bookText').value;
    const imageInput = document.getElementById('imageInput');

    if (!title || !autor || !characters || !text || !imageInput.files[0]) {
        alert('Пожалуйста, заполните все поля!');
        return;
    }

    const file = imageInput.files[0];
    const reader = new FileReader();

    reader.onload = async function(e) {
        const base64Image = e.target.result;

        const { data: existingBooks } = await supabase.from("books").select("id").order("id", { ascending: false }).limit(1);
        const nextId = existingBooks && existingBooks.length > 0 ? existingBooks[0].id + 1 : 1;

        const { data, error } = await supabase.from("books").insert([{
            id: nextId,
            title,
            autor,
            characters,
            text,
            image: base64Image
        }]);

        if (error) {
            alert("Ошибка при публикации: " + error.message);
            console.error(error);
        } else {
            alert("Книга успешно опубликована!");
            document.getElementById('public_book').style.display = 'none';
            
            document.getElementById('bookTitle').value = '';
            document.getElementById('bookAuthor').value = '';
            document.getElementById('bookCharacters').value = '';
            document.getElementById('bookText').value = '';
            document.getElementById('imageInput').value = '';
            
            loadBooks();
        }
    };

    reader.readAsDataURL(file);
}

function openBook(bookId) {
    currentBookId = bookId;
    const book = allBooks.find(b => b.id === bookId);
    if (!book) return;

    document.getElementById('currentBookImg').src = book.image || 'https://placehold.co/300x450';
    document.getElementById('currentBookTitle').textContent = book.title;
    document.getElementById('characters').innerHTML = `Персонажи: <span style="color: var(--unnactive);">${book.characters}</span>`;
    document.getElementById('currentBookText').textContent = book.text;

    document.getElementById('book').style.display = 'flex';
    document.getElementById('characters').style.height = '25px';
    document.getElementById('characters').style.whiteSpace = 'nowrap';
}

window.Open_public_block = function() {
    const passBlock = document.getElementById("password_block");
    const pubBlock = document.getElementById("public_book");

    document.getElementById("password").value = '';

    pubBlock.style.display = "none";
    pubBlock.style.opacity = "0";

    passBlock.style.display = "flex";
    setTimeout(() => passBlock.style.opacity = "1", 50);
}

window.checkpass = function(password_input) {
    const passBlock = document.getElementById("password_block");
    const pubBlock = document.getElementById("public_book");

    if (password_input != atob("Z2Zja3lyc2xmMg==")) {
        document.getElementById("password").style.borderColor = "red";
        document.getElementById("password").value = '';
        return;
    }

    document.getElementById('bookTitle').value = '';
    document.getElementById('bookAuthor').value = '';
    document.getElementById('bookCharacters').value = '';
    document.getElementById('bookText').value = '';
    document.getElementById('imageInput').value = '';

    passBlock.style.opacity = "0";
    setTimeout(() => passBlock.style.display = "none", 250);
    pubBlock.style.display = "flex";
    setTimeout(() => pubBlock.style.opacity = "1", 250);
}

window.openTg = function(tglink) {
    window.location.href = "https://t.me/" + tglink;
}

window.updateImage = function() {
    let theme = document.body.dataset.theme;
    let suffix = (theme === "light") ? "_BLACK" : "";

    const img = document.getElementById('ldn-img');
    if (img) img.src = "LDN_GLASS" + suffix + ".png";

    const themeButton = document.getElementById('theme-button');
    if (theme === 'dark') themeButton.innerHTML = '<i class="fas fa-sun"></i>';
    else themeButton.innerHTML = '<i class="fas fa-moon"></i>';

    const logo = document.getElementById("logo");
    if (!logo) return;

    if (theme === 'dark') {
        logo.src = 'ladlibrary_dark.png';
        ["1inv","3inv","4inv","5inv","6inv","7inv"].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.style.filter = "invert(1)";
        });
        const inv2 = document.getElementById("2inv");
        if (inv2) inv2.style.filter = "invert(0)";
    } else {
        logo.src = 'ladlibrary.png';
        ["1inv","3inv","4inv","5inv","6inv","7inv"].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.style.filter = "invert(0)";
        });
        const inv2 = document.getElementById("2inv");
        if (inv2) inv2.style.filter = "invert(1)";
    }
}

updateImage();

let voiceInitialized = false; // флаг, что уведомление уже показано
let currentUtterance = null;

window.Voice_Book = function() {
    const bookTextEl = document.getElementById('currentBookText');
    if (!bookTextEl) return alert('Книга не загружена');

    const bookText = bookTextEl.textContent || bookTextEl.innerText;
    if (!bookText || !bookText.trim()) return alert('Текст книги пуст!');

    const synth = window.speechSynthesis;

    if (synth.speaking || synth.paused) {
        synth.cancel();
        currentUtterance = null;
        return;
    }

    let voices = synth.getVoices();
    if (!voices.length) {
        synth.onvoiceschanged = () => window.Voice_Book();
        return;
    }

    let chosenVoice = voices.find(v => v.name.toLowerCase() === 'ivan') || voices[0];

    if (!voiceInitialized && !voices.find(v => v.name.toLowerCase() === 'ivan')) {
        alert('Голос "Ivan" не найден! Будет выбран системный голос.');
        voiceInitialized = true;
    }

    const utterance = new SpeechSynthesisUtterance(bookText);
    utterance.voice = chosenVoice;
    utterance.lang = chosenVoice.lang;
    utterance.rate = 1;
    utterance.pitch = 1.05;

    utterance.onend = () => {
        currentUtterance = null;
    };

    currentUtterance = utterance;
    synth.speak(utterance);
};

supabase.channel('books-live')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'books' }, payload => {
      console.log('Realtime update:', payload);
  })
  .subscribe();

loadBooks();
</script>

</body>
</html>
